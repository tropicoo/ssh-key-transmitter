[project]
name = "ssh-key-transmitter"
version = "0.2.8"
description = "SSH Key Transmitter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=3.5.1",
    "pysocks>=1.7.1",
    "rich>=15.0.0",
    "typer>=0.15.2",
]
[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "pip>=26.1.1",
    "pip-audit>=2.10.1",
    "pylint>=4.0.4",
    "pyrefly>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.14.13",
    "semgrep>=1.172.0",
    "setuptools>=82.0.1",
    "ty>=0.0.12",
    "wheel>=0.47.0",
]

[project.scripts]
ssh-key-transmitter = "ssh_key_transmitter:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
required-version = ">=0.9"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "B008",
    "BLE001",
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "D401",
    "E501",
    "PLR0913",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
line-ending = "lf"
docstring-code-format = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.uv.audit]
malware-check = true
ignore = [
    "PYSEC-2026-3483",
    "GHSA-jpw9-pfvf-9f58",
    "GHSA-hvrp-rf83-w775",
]
